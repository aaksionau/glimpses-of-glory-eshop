# Local dev Postgres only - matches ConnectionStrings:Default in
# appsettings.Development.json. Run: docker compose up -d
# The app itself still runs on the host via `dotnet run`/`dotnet watch`.
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: glimpsesofglory_dev
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d glimpsesofglory_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
