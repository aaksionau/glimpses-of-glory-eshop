name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  SOLUTION: GlimpsesOfGloryEshop.slnx

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.*.props', 'dotnet-tools.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore local tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Check formatting
        run: dotnet format ${{ env.SOLUTION }} --verify-no-changes --no-restore --verbosity normal

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} --no-restore --configuration Release

      # The app applies migrations at startup, so a model change committed without its
      # migration would only surface in production. This check compares the model with the
      # latest migration snapshot and opens no database connection; the dummy connection
      # string only satisfies Program.cs, which requires one to build the host.
      - name: Check for model changes without a migration
        env:
          ConnectionStrings__Default: Host=localhost;Database=ci_model_check;Username=ci;Password=ci
        run: >-
          dotnet ef migrations has-pending-model-changes
          --project src/GlimpsesOfGlory.Core
          --startup-project src/GlimpsesOfGlory.Web
          --no-build
          --configuration Release

      - name: Test
        run: dotnet test ${{ env.SOLUTION }} --no-build --configuration Release --verbosity normal
